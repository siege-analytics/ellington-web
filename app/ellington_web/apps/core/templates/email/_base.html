<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Ellington{% endblock %}</title>
<style>
  /* Email-client-safe inlined-friendly styles. MuseJazz Text is the
     brand typeface (#102) but most email clients strip web fonts, so
     we lean on the fallback stack and let webmail clients that do
     support web fonts pick it up via the <link>. */
  body {
    font-family: "MuseJazz Text", "Bradley Hand", "Comic Sans MS", cursive, serif;
    color: #1a1a1a;
    background: #f6f1e6;
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  .container {
    max-width: 560px;
    margin: 0 auto;
    background: #fffbf2;
    border: 1px solid #d9cdb3;
    border-radius: 4px;
    padding: 32px;
  }
  .wordmark {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 0.02em;
    margin: 0 0 24px 0;
    color: #1a1a1a;
  }
  .footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid #d9cdb3;
    font-size: 12px;
    color: #6b5d44;
  }
  a { color: #8a3324; text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="wordmark">Ellington</div>
  {% block body %}{% endblock %}
  <div class="footer">
    {% block footer %}
    You're receiving this because someone with your email address has an
    account at <a href="https://ellington.siegeanalytics.com">ellington.siegeanalytics.com</a>.
    {% endblock %}
  </div>
</div>
</body>
</html>
