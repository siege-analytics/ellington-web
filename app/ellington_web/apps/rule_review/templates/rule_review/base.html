{% extends "base.html" %}

{% block title %}Rule review — Ellington{% endblock %}

{% block sub_nav %}
<nav class="sub-nav">
  <a href="{% url 'rule_review:rule_library' %}">Library</a>
  <a href="{% url 'rule_review:rule_list' %}">Verdicts</a>
  {% if user.is_staff %}<a href="{% url 'rule_review:admin_queue' %}">Review queue</a>{% endif %}
</nav>
{% endblock %}

{% block extra_head %}
<style>
  /* App-specific styling for rule cards / anchor quotes / comment
     threads. Shell-wide elements (nav, messages, tables, forms,
     buttons, verdict badges) live in brand.css now. */
  .rule-card {
    background: var(--bg-elev); border: 1px solid var(--bg-border);
    border-radius: 4px; padding: 1em; margin-bottom: 1em;
  }
  .rule-card pre {
    background: var(--bg); border-radius: 3px; padding: 0.5em;
    overflow-x: auto; font-size: var(--text-sm);
  }
  .anchor-quote {
    background: var(--verdict-close-but-bg);
    border-left: 4px solid var(--chord-maj7);
    padding: 0.5em 1em; margin: 0.5em 0; font-style: italic;
  }
  .comment {
    border-left: 3px solid var(--bg-border); padding: 0.5em 1em;
    margin: 0.5em 0;
  }
  .comment.reply { margin-left: 2em; }
</style>
{% endblock %}
